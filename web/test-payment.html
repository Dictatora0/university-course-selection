<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试充值和提现功能</title>
    <!-- 使用Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        body {
            padding: 20px;
            font-family: 'Arial', sans-serif;
        }
        .card {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">充值和提现功能测试</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">账户余额</div>
                    <div class="card-body">
                        <h3 class="display-4" id="balanceAmount">¥ 0.00</h3>
                        <button id="depositBtn" class="btn btn-success me-2 mt-2">充值</button>
                        <button id="withdrawBtn" class="btn btn-warning mt-2">提现</button>
                    </div>
                </div>
                
                <!-- 充值表单 -->
                <div id="depositForm" class="card mt-3" style="display: none;">
                    <div class="card-header">充值</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="depositAmountInput" class="form-label">充值金额</label>
                            <input type="number" id="depositAmountInput" class="form-control" min="1" step="0.01" placeholder="输入金额">
                        </div>
                        <button id="confirmDepositBtn" class="btn btn-primary">确认充值</button>
                        <button id="cancelDepositBtn" class="btn btn-secondary ms-2">取消</button>
                    </div>
                </div>
                
                <!-- 提现表单 -->
                <div id="withdrawForm" class="card mt-3" style="display: none;">
                    <div class="card-header">提现</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="withdrawAmountInput" class="form-label">提现金额</label>
                            <input type="number" id="withdrawAmountInput" class="form-control" min="1" step="0.01" placeholder="输入金额">
                        </div>
                        <button id="confirmWithdrawBtn" class="btn btn-primary">确认提现</button>
                        <button id="cancelWithdrawBtn" class="btn btn-secondary ms-2">取消</button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">控制台日志</div>
                    <div class="card-body">
                        <pre id="logOutput" style="max-height: 400px; overflow-y: auto;"></pre>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">调试操作</div>
                    <div class="card-body">
                        <button id="testToggleDepositBtn" class="btn btn-outline-primary me-2">测试显示充值表单</button>
                        <button id="testToggleWithdrawBtn" class="btn btn-outline-primary me-2">测试显示提现表单</button>
                        <button id="checkElementsBtn" class="btn btn-outline-info">检查DOM元素</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast 容器 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <!-- Toast 元素将通过JS动态添加 -->
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // 简单的日志函数
        function log(message) {
            const logOutput = document.getElementById('logOutput');
            const timestamp = new Date().toLocaleTimeString();
            logOutput.innerHTML += `[${timestamp}] ${message}\n`;
            logOutput.scrollTop = logOutput.scrollHeight;
            console.log(message);
        }
        
        // 显示Toast消息
        function showToast(message, type = 'info') {
            const toastContainer = document.querySelector('.toast-container');
            if (!toastContainer) return;
            
            const toastId = 'toast-' + Date.now();
            const toastHTML = `
                <div id="${toastId}" class="toast align-items-center text-white bg-${type} border-0" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex">
                        <div class="toast-body">
                            ${message}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>
            `;
            toastContainer.insertAdjacentHTML('beforeend', toastHTML);
            
            const toastElement = document.getElementById(toastId);
            const toast = new bootstrap.Toast(toastElement, { delay: 3000 });
            toast.show();
            toastElement.addEventListener('hidden.bs.toast', () => toastElement.remove());
        }
        
        // 切换表单显示/隐藏
        function togglePaymentForm(formId, show) {
            log(`切换表单: ${formId}, 显示: ${show}`);
            const form = document.getElementById(formId);
            if (form) {
                form.style.display = show ? 'block' : 'none';
                log(`表单 ${formId} 已${show ? '显示' : '隐藏'}`);
            } else {
                log(`错误: 找不到ID为 ${formId} 的表单元素`);
            }
        }
        
        // 充值处理函数
        function handleDeposit() {
            log("处理充值请求");
            const amountInput = document.getElementById('depositAmountInput');
            if (!amountInput) {
                showToast('找不到充值金额输入框', 'danger');
                return;
            }
            
            const amount = parseFloat(amountInput.value);
            if (isNaN(amount) || amount <= 0) {
                showToast('请输入有效的充值金额', 'danger');
                return;
            }
            
            showToast(`模拟充值 ${amount} 元成功！`, 'success');
            log(`充值金额: ${amount} 元`);
            
            // 更新余额（测试用）
            const balanceEl = document.getElementById('balanceAmount');
            if (balanceEl) {
                const currentBalance = parseFloat(balanceEl.textContent.replace('¥', '').trim()) || 0;
                balanceEl.textContent = `¥ ${(currentBalance + amount).toFixed(2)}`;
            }
            
            // 隐藏表单
            amountInput.value = '';
            togglePaymentForm('depositForm', false);
        }
        
        // 提现处理函数
        function handleWithdraw() {
            log("处理提现请求");
            const amountInput = document.getElementById('withdrawAmountInput');
            if (!amountInput) {
                showToast('找不到提现金额输入框', 'danger');
                return;
            }
            
            const amount = parseFloat(amountInput.value);
            if (isNaN(amount) || amount <= 0) {
                showToast('请输入有效的提现金额', 'danger');
                return;
            }
            
            // 检查余额是否足够
            const balanceEl = document.getElementById('balanceAmount');
            if (balanceEl) {
                const currentBalance = parseFloat(balanceEl.textContent.replace('¥', '').trim()) || 0;
                if (amount > currentBalance) {
                    showToast('余额不足，无法提现', 'danger');
                    return;
                }
                
                // 更新余额（测试用）
                balanceEl.textContent = `¥ ${(currentBalance - amount).toFixed(2)}`;
            }
            
            showToast(`模拟提现 ${amount} 元成功！`, 'success');
            log(`提现金额: ${amount} 元`);
            
            // 隐藏表单
            amountInput.value = '';
            togglePaymentForm('withdrawForm', false);
        }
        
        // 绑定事件监听器
        document.addEventListener('DOMContentLoaded', function() {
            log('页面加载完成，初始化事件监听器');
            
            // 充值按钮
            const depositBtn = document.getElementById('depositBtn');
            if (depositBtn) {
                depositBtn.addEventListener('click', function() {
                    log('充值按钮被点击');
                    togglePaymentForm('depositForm', true);
                    togglePaymentForm('withdrawForm', false);
                });
            } else {
                log('错误: 找不到充值按钮');
            }
            
            // 提现按钮
            const withdrawBtn = document.getElementById('withdrawBtn');
            if (withdrawBtn) {
                withdrawBtn.addEventListener('click', function() {
                    log('提现按钮被点击');
                    togglePaymentForm('withdrawForm', true);
                    togglePaymentForm('depositForm', false);
                });
            } else {
                log('错误: 找不到提现按钮');
            }
            
            // 确认充值按钮
            const confirmDepositBtn = document.getElementById('confirmDepositBtn');
            if (confirmDepositBtn) {
                confirmDepositBtn.addEventListener('click', handleDeposit);
            } else {
                log('错误: 找不到确认充值按钮');
            }
            
            // 确认提现按钮
            const confirmWithdrawBtn = document.getElementById('confirmWithdrawBtn');
            if (confirmWithdrawBtn) {
                confirmWithdrawBtn.addEventListener('click', handleWithdraw);
            } else {
                log('错误: 找不到确认提现按钮');
            }
            
            // 取消充值按钮
            const cancelDepositBtn = document.getElementById('cancelDepositBtn');
            if (cancelDepositBtn) {
                cancelDepositBtn.addEventListener('click', function() {
                    log('取消充值按钮被点击');
                    togglePaymentForm('depositForm', false);
                });
            } else {
                log('错误: 找不到取消充值按钮');
            }
            
            // 取消提现按钮
            const cancelWithdrawBtn = document.getElementById('cancelWithdrawBtn');
            if (cancelWithdrawBtn) {
                cancelWithdrawBtn.addEventListener('click', function() {
                    log('取消提现按钮被点击');
                    togglePaymentForm('withdrawForm', false);
                });
            } else {
                log('错误: 找不到取消提现按钮');
            }
            
            // 测试调试按钮
            document.getElementById('testToggleDepositBtn')?.addEventListener('click', function() {
                log('测试显示充值表单按钮被点击');
                togglePaymentForm('depositForm', true);
                togglePaymentForm('withdrawForm', false);
            });
            
            document.getElementById('testToggleWithdrawBtn')?.addEventListener('click', function() {
                log('测试显示提现表单按钮被点击');
                togglePaymentForm('withdrawForm', true);
                togglePaymentForm('depositForm', false);
            });
            
            document.getElementById('checkElementsBtn')?.addEventListener('click', function() {
                log('检查DOM元素按钮被点击');
                
                const elements = [
                    'depositBtn', 'withdrawBtn', 'depositForm', 'withdrawForm',
                    'depositAmountInput', 'withdrawAmountInput', 
                    'confirmDepositBtn', 'confirmWithdrawBtn',
                    'cancelDepositBtn', 'cancelWithdrawBtn'
                ];
                
                elements.forEach(id => {
                    const el = document.getElementById(id);
                    log(`元素 ${id}: ${el ? '存在' : '不存在'}`);
                });
            });
            
            // 初始化
            log('初始化完成，设置测试余额为100元');
            const balanceEl = document.getElementById('balanceAmount');
            if (balanceEl) balanceEl.textContent = '¥ 100.00';
        });
    </script>
</body>
</html>
