<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员仪表盘 - 课程选择系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
        }
        
        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #34495e;
        }
        
        .sidebar-header h1 {
            font-size: 18px;
            margin: 0;
        }
        
        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .sidebar-menu li {
            padding: 0;
            margin: 0;
        }
        
        .sidebar-menu a {
            display: flex;
            align-items: center;
            color: #ecf0f1;
            text-decoration: none;
            padding: 15px 20px;
            transition: background-color 0.3s;
        }
        
        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: #34495e;
            color: #fff;
        }
        
        .sidebar-menu a i {
            margin-right: 10px;
        }
        
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        
        .header {
            background-color: #fff;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-title {
            font-size: 20px;
            color: #2c3e50;
        }
        
        .user-info {
            display: flex;
            align-items: center;
        }
        
        .user-info .user-name {
            margin-right: 10px;
            color: #2c3e50;
        }
        
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .tab-content {
            display: none;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -10px;
        }
        
        .col {
            flex: 1;
            padding: 0 10px;
            min-width: 200px;
        }
        
        .card-value {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 10px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        table th, table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e1e1e1;
        }
        
        table th {
            background-color: #f8f9fa;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .btn {
            display: inline-block;
            padding: 8px 16px;
            font-size: 14px;
            text-align: center;
            text-decoration: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn-primary {
            background-color: #4CAF50;
            color: white;
            border: none;
        }
        
        .btn-primary:hover {
            background-color: #45a049;
        }
        
        .btn-danger {
            background-color: #f44336;
            color: white;
            border: none;
        }
        
        .btn-danger:hover {
            background-color: #d32f2f;
        }
        
        .btn-secondary {
            background-color: #2196F3;
            color: white;
            border: none;
        }
        
        .btn-secondary:hover {
            background-color: #0b7dda;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #34495e;
        }
        
        .form-control {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background-color: #fff;
            width: 500px;
            max-width: 90%;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        
        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid #dcdfe6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h2 {
            margin: 0;
            font-size: 18px;
            color: #2c3e50;
        }
        
        .modal-header .close {
            cursor: pointer;
            font-size: 20px;
            color: #7f8c8d;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid #dcdfe6;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>课程选择系统管理中心</h1>
        </div>
        <ul class="sidebar-menu">
            <li><a href="#dashboard" class="active" data-target="dashboard"><i class="bi bi-house-door"></i> 首页</a></li>
            <li><a href="#courses" data-target="courses"><i class="bi bi-book"></i> 课程管理</a></li>
            <li><a href="#students" data-target="students"><i class="bi bi-people"></i> 学生管理</a></li>
            <li><a href="#transactions" data-target="transactions"><i class="bi bi-cash-coin"></i> 交易记录</a></li>
            <li><a href="#admins" data-target="admins"><i class="bi bi-person-badge"></i> 管理员</a></li>
            <li><a href="#settings" data-target="settings"><i class="bi bi-gear"></i> 系统设置</a></li>
            <li><a href="#" id="logout"><i class="bi bi-box-arrow-right"></i> 退出登录</a></li>
        </ul>
    </div>

    <div class="main-container">
        <div class="header">
            <div class="header-title">管理员仪表盘</div>
            <div class="user-info">
                <span class="user-name">欢迎，<span id="adminName">加载中...</span></span>
                <span class="user-role" id="adminRole">管理员</span>
            </div>
        </div>

        <div class="content">
            <!-- 首页 -->
            <section id="dashboard" class="tab-content active">
                <h2>系统概览</h2>
                <div class="dashboard-cards">
                    <div class="row">
                        <div class="col">
                            <div class="card">
                                <h3>学生总数</h3>
                                <p class="card-value" id="studentCount">加载中...</p>
                            </div>
                        </div>
                        <div class="col">
                            <div class="card">
                                <h3>课程总数</h3>
                                <p class="card-value" id="courseCount">加载中...</p>
                            </div>
                        </div>
                        <div class="col">
                            <div class="card">
                                <h3>今日活跃用户</h3>
                                <p class="card-value" id="activeUsers">加载中...</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <h3>最近交易记录</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>交易ID</th>
                                <th>学生ID</th>
                                <th>类型</th>
                                <th>金额</th>
                                <th>时间</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody id="recentTransactions">
                            <tr>
                                <td colspan="6" class="loading">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
            
            <!-- 以下部分将通过JavaScript动态加载 -->
            <section id="courses" class="tab-content">
                <h2>课程管理</h2>
                <div id="coursesContent">加载中...</div>
            </section>
            
            <section id="students" class="tab-content">
                <h2>学生管理</h2>
                <div id="studentsContent">加载中...</div>
            </section>
            
            <section id="transactions" class="tab-content">
                <h2>交易记录</h2>
                <div id="transactionsContent">加载中...</div>
            </section>
            
            <section id="admins" class="tab-content">
                <h2>管理员管理</h2>
                <div id="adminsContent">加载中...</div>
            </section>
            
            <section id="settings" class="tab-content">
                <h2>系统设置</h2>
                <div id="settingsContent">加载中...</div>
            </section>
        </div>
    </div>

    <!-- 模态框模板，将在JavaScript中动态复制并使用 -->
    <div class="modal" id="modalTemplate">
        <div class="modal-content">
            <div class="modal-header">
                <h2>标题</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                内容将在JavaScript中设置
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-cancel">取消</button>
                <button class="btn btn-primary modal-confirm">确定</button>
            </div>
        </div>
    </div>

    <script src="js/admin_dashboard.js"></script>
</body>
</html>
