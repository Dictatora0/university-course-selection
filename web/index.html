<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线选课系统 - 登录</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .form-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .register-link {
            color: #3498db;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 10px;
            display: block;
            text-align: center;
        }
        .register-form {
            display: none;
        }
        .form-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            font-size: 14px;
            color: #3498db;
            cursor: pointer;
            text-decoration: underline;
        }
        .error-message {
            color: #e74c3c;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            background-color: #fdecea;
            border-left: 4px solid #e74c3c;
        }
        .info-message {
            color: #3498db;
            font-size: 12px;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>在线选课系统</h1>
        
        <!-- 登录表单 -->
        <div class="login-form" id="loginFormContainer">
            <div class="form-group">
                <label for="studentId">学号</label>
                <input type="text" id="studentId" name="student_id" placeholder="请输入学号">
                <span class="info-message">格式示例: S2023001 (以S开头)</span>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码">
            </div>
            <button id="loginBtn" class="btn-login">登录</button>
            <a class="register-link" id="showRegisterForm">没有账号？点击注册</a>
            <div id="errorMsg" class="error-message"></div>
        </div>
        
        <!-- 注册表单 -->
        <div class="register-form" id="registerFormContainer">
            <div class="form-title">
                <h2>注册新账号</h2>
                <span class="back-btn" id="backToLogin">返回登录</span>
            </div>
            <div class="form-group">
                <label for="regStudentId">学号</label>
                <input type="text" id="regStudentId" name="student_id" placeholder="请输入学号">
                <span class="info-message">学号格式: S开头的数字 (如S2023001)</span>
            </div>
            <div class="form-group">
                <label for="regName">姓名</label>
                <input type="text" id="regName" name="name" placeholder="请输入姓名">
            </div>
            <div class="form-group">
                <label for="regPassword">密码</label>
                <input type="password" id="regPassword" name="password" placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label for="regConfirmPassword">确认密码</label>
                <input type="password" id="regConfirmPassword" name="confirm_password" placeholder="请再次输入密码">
            </div>
            <button id="registerBtn" class="btn-login">注册</button>
            <div id="regErrorMsg" class="error-message"></div>
        </div>
        
        <div class="login-footer" style="margin-top: 20px; text-align: center;">
            <a href="admin_login.html" style="color: #7f8c8d; font-size: 14px; text-decoration: none;">管理员登录</a>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM内容加载完成，初始化登录页面');
            
            const loginBtn = document.getElementById('loginBtn');
            const studentIdInput = document.getElementById('studentId');
            const passwordInput = document.getElementById('password');
            const errorMsg = document.getElementById('errorMsg');
            
            const registerBtn = document.getElementById('registerBtn');
            const regStudentIdInput = document.getElementById('regStudentId');
            const regNameInput = document.getElementById('regName');
            const regPasswordInput = document.getElementById('regPassword');
            const regConfirmPasswordInput = document.getElementById('regConfirmPassword');
            const regErrorMsg = document.getElementById('regErrorMsg');
            
            const showRegisterFormBtn = document.getElementById('showRegisterForm');
            const backToLoginBtn = document.getElementById('backToLogin');
            const loginFormContainer = document.getElementById('loginFormContainer');
            const registerFormContainer = document.getElementById('registerFormContainer');
            
            // 检查学号格式，确保以S开头
            function formatStudentId(studentId) {
                studentId = studentId.trim();
                // 如果没有以S开头，添加S前缀
                if (!studentId.startsWith('S')) {
                    studentId = 'S' + studentId;
                }
                return studentId;
            }
            
            // 切换到注册表单
            showRegisterFormBtn.addEventListener('click', function() {
                loginFormContainer.style.display = 'none';
                registerFormContainer.style.display = 'block';
            });
            
            // 返回登录表单
            backToLoginBtn.addEventListener('click', function() {
                registerFormContainer.style.display = 'none';
                loginFormContainer.style.display = 'block';
            });
            
            // 登录状态检查可以暂时注释，保证登录页面能正常显示
            /*
            console.log('检查登录状态...');
            fetch('/course-selection/api/students/getInfo', {
                method: 'GET',
                credentials: 'include'
            })
            .then(response => {
                console.log('检查登录状态响应:', response.status, response.statusText);
                if (!response.ok) {
                    throw new Error('未登录');
                }
                return response.json();
            })
            .then(data => {
                console.log('检查登录状态数据:', data);
                if (data.success) {
                    // 已登录，跳转到主页
                    window.location.href = 'student_dashboard.html';
                }
            })
            .catch(err => {
                // 未登录，显示登录页面
                console.log('用户未登录，显示登录页面', err);
            });
            */
            
            // 登录
            loginBtn.addEventListener('click', function() {
                console.log('点击登录按钮');
                let studentId = studentIdInput.value.trim();
                const password = passwordInput.value.trim();
                
                if (!studentId || !password) {
                    showError(errorMsg, '请输入学号和密码');
                    return;
                }
                
                // 格式化学号，确保以S开头
                studentId = formatStudentId(studentId);
                console.log('格式化后的学号:', studentId);
                
                // 禁用按钮，显示加载状态
                loginBtn.disabled = true;
                loginBtn.textContent = '登录中...';
                hideError(errorMsg);
                
                const loginData = {
                    student_id: studentId,
                    password: password
                };
                
                console.log('发送登录请求: 学号=', studentId);
                console.log('请求数据:', JSON.stringify(loginData));
                
                fetch('/course-selection/api/students/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(loginData),
                    credentials: 'include'
                })
                .then(response => {
                    console.log('登录响应状态:', response.status, response.statusText);
                    return response.json().catch(error => {
                        // 处理非JSON响应
                        console.error('解析JSON失败:', error);
                        throw new Error('服务器响应格式错误');
                    });
                })
                .then(data => {
                    console.log('登录响应数据:', data);
                    
                    if (data.success) {
                        // 登录成功，将用户信息保存到localStorage
                        console.log('登录成功，保存用户信息');
                        const userData = {
                            studentId: data.data.student_id,
                            name: data.data.name,
                            balance: data.data.balance
                        };
                        localStorage.setItem('user', JSON.stringify(userData));
                        localStorage.setItem('userType', 'student');
                        
                        // 跳转到主页 - 使用绝对路径
                        console.log('准备跳转到学生仪表盘');
                        // 获取当前网站的协议、主机和端口，构建完整的绝对URL
                        const protocol = window.location.protocol;
                        const host = window.location.host;
                        const baseUrl = protocol + '//' + host;
                        
                        // 获取当前应用的上下文路径
                        const contextPath = '/course-selection'; // 硬编码确保正确
                        
                        // 构建完整的绝对URL
                        const absoluteUrl = baseUrl + contextPath + '/student_dashboard.html';
                        
                        console.log('跳转URL详情:');
                        console.log('- protocol:', protocol);
                        console.log('- host:', host);
                        console.log('- baseUrl:', baseUrl);
                        console.log('- contextPath:', contextPath);
                        console.log('- 最终跳转URL:', absoluteUrl);
                        
                        // 开始跳转
                        window.location.href = absoluteUrl;
                    } else {
                        // 登录失败，显示错误信息
                        console.error('登录失败:', data.message);
                        showError(errorMsg, data.message || '登录失败，请检查学号和密码');
                    }
                })
                .catch(error => {
                    console.error('登录请求发生错误:', error);
                    showError(errorMsg, '网络错误，请稍后再试');
                })
                .finally(() => {
                    // 恢复按钮状态
                    loginBtn.disabled = false;
                    loginBtn.textContent = '登录';
                });
            });
            
            // 注册
            registerBtn.addEventListener('click', function() {
                console.log('点击注册按钮');
                let studentId = regStudentIdInput.value.trim();
                const name = regNameInput.value.trim();
                const password = regPasswordInput.value.trim();
                const confirmPassword = regConfirmPasswordInput.value.trim();
                
                // 验证输入
                if (!studentId || !name || !password || !confirmPassword) {
                    showError(regErrorMsg, '请填写所有必填字段');
                    return;
                }
                
                if (password !== confirmPassword) {
                    showError(regErrorMsg, '两次输入的密码不一致');
                    return;
                }
                
                // 格式化学号，确保以S开头
                studentId = formatStudentId(studentId);
                console.log('格式化后的学号:', studentId);
                
                // 显示加载状态
                registerBtn.disabled = true;
                registerBtn.textContent = '注册中...';
                hideError(regErrorMsg);
                
                const registerData = {
                    student_id: studentId,
                    name: name,
                    password: password,
                    birth_date: null,
                    id_card: null,
                    address: null,
                    department_id: "DEPT1"
                };
                
                console.log('发送注册请求: 学号=', studentId, '姓名=', name);
                console.log('请求数据:', JSON.stringify(registerData));
                
                fetch('/course-selection/api/students/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(registerData),
                    credentials: 'include'
                })
                .then(response => {
                    console.log('注册响应状态:', response.status, response.statusText);
                    return response.json().catch(error => {
                        // 处理非JSON响应
                        console.error('解析JSON失败:', error);
                        throw new Error('服务器响应格式错误');
                    });
                })
                .then(data => {
                    console.log('注册响应数据:', data);
                    
                    if (data.success) {
                        // 注册成功
                        console.log('注册成功');
                        alert('注册成功，请登录');
                        
                        // 清空注册表单并返回登录页面
                        regStudentIdInput.value = '';
                        regNameInput.value = '';
                        regPasswordInput.value = '';
                        regConfirmPasswordInput.value = '';
                        
                        // 返回登录表单
                        registerFormContainer.style.display = 'none';
                        loginFormContainer.style.display = 'block';
                        
                        // 自动填充学号
                        studentIdInput.value = studentId;
                    } else {
                        // 注册失败
                        console.error('注册失败:', data.message);
                        showError(regErrorMsg, data.message || '注册失败，请稍后再试');
                    }
                })
                .catch(error => {
                    console.error('注册请求发生错误:', error);
                    showError(regErrorMsg, '网络错误，请稍后再试');
                })
                .finally(() => {
                    // 恢复按钮状态
                    registerBtn.disabled = false;
                    registerBtn.textContent = '注册';
                });
            });
            
            // 显示错误信息
            function showError(element, message) {
                if (element) {
                    element.textContent = message;
                    element.style.display = 'block';
                }
            }
            
            // 隐藏错误信息
            function hideError(element) {
                if (element) {
                    element.style.display = 'none';
                }
            }
            
            // 按回车键登录
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    loginBtn.click();
                }
            });
            
            // 按回车键注册
            regConfirmPasswordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    registerBtn.click();
                }
            });
        });
    </script>
</body>
</html>
