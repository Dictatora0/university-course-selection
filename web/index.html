<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线选课系统 - 登录</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <h1>在线选课系统</h1>
        <div class="login-form">
            <div class="form-group">
                <label for="studentId">学号</label>
                <input type="text" id="studentId" placeholder="请输入学号">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码">
            </div>
            <button id="loginBtn" class="btn-login">登录</button>
            <div id="errorMsg" class="error-message"></div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginBtn = document.getElementById('loginBtn');
            const studentIdInput = document.getElementById('studentId');
            const passwordInput = document.getElementById('password');
            const errorMsg = document.getElementById('errorMsg');
            
            // 检查是否已登录
            API.student.getInfo()
                .then(data => {
                    // 已登录，跳转到主页
                    window.location.href = 'student_dashboard.html';
                })
                .catch(err => {
                    // 未登录，显示登录页面
                    console.log('请登录');
                });
            
            loginBtn.addEventListener('click', async function() {
                const studentId = studentIdInput.value.trim();
                const password = passwordInput.value.trim();
                
                if (!studentId || !password) {
                    errorMsg.textContent = '请输入学号和密码';
                    return;
                }
                
                try {
                    errorMsg.textContent = '';
                    await API.student.login(studentId, password);
                    window.location.href = 'student_dashboard.html';
                } catch (error) {
                    errorMsg.textContent = error.message || '登录失败，请检查学号和密码';
                }
            });
            
            // 按回车键登录
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    loginBtn.click();
                }
            });
        });
    </script>
</body>
</html>
