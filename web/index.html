<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>大学生选课系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header text-center">
                        <h3>在线选课系统</h3>
                    </div>
                    <div class="card-body">
                        <ul class="nav nav-tabs" id="loginTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="student-tab" data-bs-toggle="tab" data-bs-target="#student" type="button" role="tab">学生登录</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin" type="button" role="tab">管理员登录</button>
                            </li>
                        </ul>
                        
                        <div class="tab-content mt-3" id="loginTabContent">
                            <div class="tab-pane fade show active" id="student" role="tabpanel">
                                <form id="studentLoginForm">
                                    <div class="mb-3">
                                        <label for="studentId" class="form-label">学号</label>
                                        <input type="text" class="form-control" id="studentId" name="studentId" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="studentPassword" class="form-label">密码</label>
                                        <input type="password" class="form-control" id="studentPassword" name="password" required>
                                    </div>
                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-primary">登录</button>
                                    </div>
                                </form>
                            </div>
                            <div class="tab-pane fade" id="admin" role="tabpanel">
                                <form id="adminLoginForm">
                                    <div class="mb-3">
                                        <label for="adminId" class="form-label">管理员ID</label>
                                        <input type="text" class="form-control" id="adminId" name="adminId" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="adminPassword" class="form-label">密码</label>
                                        <input type="password" class="form-control" id="adminPassword" name="password" required>
                                    </div>
                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-primary">登录</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer text-center">
                        <small>&copy; 2023 在线选课系统</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
