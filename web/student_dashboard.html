<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>学生仪表盘 - 大学生选课系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">大学生选课系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="student_dashboard.html">主页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="courseSelectionNav">选课</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="gradesNav">成绩查询</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="friendsNav">好友</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="messagesNav">消息</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-white me-3" id="studentName">加载中...</span>
                    <button class="btn btn-outline-light btn-sm" id="logoutBtn">退出</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- 主内容区域 -->
        <div id="mainContent">
            <!-- 欢迎信息 -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">欢迎回来，<span id="welcomeName">同学</span>！</h5>
                    <p class="card-text">今天是 <span id="currentDate"></span>，祝你学习愉快！</p>
                </div>
            </div>

            <div class="row">
                <!-- 已选课程 -->
                <div class="col-md-8">
                    <div class="card mb-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">我的课程</h5>
                            <button class="btn btn-sm btn-primary" id="selectCourseBtn">选择更多课程</button>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>课程号</th>
                                            <th>课程名称</th>
                                            <th>学分</th>
                                            <th>开课院系</th>
                                            <th>成绩</th>
                                        </tr>
                                    </thead>
                                    <tbody id="enrolledCoursesList">
                                        <!-- 动态加载学生已选课程 -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 右侧信息 -->
                <div class="col-md-4">
                    <!-- 最近登录记录 -->
                    <div class="card mb-4">
                        <div class="card-header">
                            <h5 class="mb-0">最近登录记录</h5>
                        </div>
                        <div class="card-body">
                            <ul class="list-group list-group-flush" id="loginRecordsList">
                                <!-- 动态加载登录记录 -->
                            </ul>
                        </div>
                    </div>

                    <!-- 好友推荐 -->
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">好友推荐</h5>
                        </div>
                        <div class="card-body">
                            <ul class="list-group list-group-flush" id="recommendedFriendsList">
                                <!-- 动态加载推荐好友 -->
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 选课页面 -->
        <div id="courseSelectionPage" class="d-none">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">选择课程</h5>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <input type="text" class="form-control" id="courseSearchInput" placeholder="搜索课程...">
                        </div>
                        <div class="col-md-6">
                            <select class="form-select" id="deptFilter">
                                <option value="">所有院系</option>
                                <!-- 动态加载院系选项 -->
                            </select>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>课程号</th>
                                    <th>课程名称</th>
                                    <th>学分</th>
                                    <th>开课院系</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="availableCoursesList">
                                <!-- 动态加载可选课程 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- 成绩查询页面 -->
        <div id="gradesPage" class="d-none">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">成绩单</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>课程号</th>
                                    <th>课程名称</th>
                                    <th>学分</th>
                                    <th>成绩</th>
                                    <th>选课时间</th>
                                </tr>
                            </thead>
                            <tbody id="gradesList">
                                <!-- 动态加载成绩 -->
                            </tbody>
                        </table>
                    </div>
                    <div class="mt-3">
                        <h6>学分统计：<span id="totalCredits">0</span> 学分</h6>
                        <h6>平均绩点：<span id="gpa">0.00</span></h6>
                    </div>
                </div>
            </div>
        </div>

        <!-- 好友页面 -->
        <div id="friendsPage" class="d-none">
            <div class="row">
                <div class="col-md-7">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">我的好友</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <input type="text" class="form-control" id="friendSearchInput" placeholder="搜索好友...">
                            </div>
                            <ul class="list-group" id="friendsList">
                                <!-- 动态加载好友列表 -->
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="card mb-4">
                        <div class="card-header">
                            <h5 class="mb-0">好友推荐</h5>
                        </div>
                        <div class="card-body">
                            <ul class="list-group" id="friendRecommendations">
                                <!-- 动态加载好友推荐 -->
                            </ul>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">添加好友</h5>
                        </div>
                        <div class="card-body">
                            <form id="addFriendForm">
                                <div class="mb-3">
                                    <label for="friendId" class="form-label">好友学号</label>
                                    <input type="text" class="form-control" id="friendId" required>
                                </div>
                                <button type="submit" class="btn btn-primary">添加</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 消息页面 -->
        <div id="messagesPage" class="d-none">
            <div class="row">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">联系人</h5>
                        </div>
                        <div class="card-body p-0">
                            <ul class="list-group list-group-flush" id="contactsList">
                                <!-- 动态加载联系人 -->
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0" id="chatName">选择一个联系人开始聊天</h5>
                            <div id="transferMoneyBtn" class="d-none">
                                <button class="btn btn-sm btn-outline-primary">转账</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="chat-container" id="chatMessages">
                                <!-- 动态加载聊天消息 -->
                            </div>
                        </div>
                        <div class="card-footer">
                            <form id="messageForm">
                                <div class="input-group">
                                    <input type="text" class="form-control" id="messageInput" placeholder="输入消息...">
                                    <button type="submit" class="btn btn-primary">发送</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 转账模态框 -->
    <div class="modal fade" id="transferModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">转账</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="transferForm">
                        <div class="mb-3">
                            <label class="form-label">收款人</label>
                            <p class="form-control-static" id="transferRecipient"></p>
                            <input type="hidden" id="recipientId">
                        </div>
                        <div class="mb-3">
                            <label for="transferAmount" class="form-label">金额</label>
                            <input type="number" class="form-control" id="transferAmount" min="0.01" step="0.01" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">确认转账</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/student_dashboard.js"></script>
</body>
</html>
